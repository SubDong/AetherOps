blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability (do NOT open an issue)
    url: https://github.com/SubDong/AetherOps/security/advisories/new
    about: >-
      AetherOps gives an AI agent real shell access to your servers. Please use GitHub's private
      vulnerability reporting; see SECURITY.md for what qualifies and how disclosure is handled.
  - name: Documentation index
    url: https://github.com/SubDong/AetherOps/tree/master/docs
    about: Getting started, configuration, deployment, accounts and permissions, AI models and cost, jump hosts, skills, troubleshooting
  - name: Contributing guide
    url: https://github.com/SubDong/AetherOps/blob/master/CONTRIBUTING.md
    about: Development environment, code style, test scripts, dependency pinning, migration and authorization rules
  - name: Known limitations — please read before opening a "doesn't work" issue
    url: https://github.com/SubDong/AetherOps/blob/master/CHANGELOG.md#known-gaps-at-this-point
    about: >-
      Some things are documented gaps rather than bugs (no skill-authoring UI, no HA mode, HarmonyOS
      not fleet-tested, no release tags/artifacts yet, smoke script needs a login step).
