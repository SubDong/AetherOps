# CNB 云构建配置
# 文档: https://docs.cnb.cool/zh/build/grammar.html
#
# 依赖钉版约定（与 Dockerfile / GitHub Actions 一致）：
#   1. pnpm install 一律 --frozen-lockfile：锁文件是唯一事实，声明与锁不一致就直接失败，
#      不允许重解析。所以升级 @cicctencent/agent-core / vite 必须把 package.json 和
#      pnpm-lock.yaml 提交到同一个 commit，否则这里必红。
#   2. 升级只走 pnpm run upgrade-pin -- <包名>@<精确版本>，构建期另有
#      scripts/check-engine-pin.mjs 兜底（声明带 ^ / latest，或装的和声明不符都会 exit 1）。
#   3. prepare dist dependencies 那步用的是 npm、读不到 pnpm 的锁，靠的是 package.json
#      里写死的精确版本；引擎与 vite 已钉死，其余传递依赖仍可能有浮动（Linux 产物内的
#      dist/node_modules 会被优先 require 到，所以那两处绝对不能放范围版本）。

# ============================================================
# master 分支: 推送时构建验证（不发布 Release）
# ============================================================
master:
  push:
    - name: build-verify
      docker:
        image: node:22
        volumes:
          - pnpm-store:/root/.local/share/pnpm/store/v3:rw
      env:
        ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        CI: 'true'
      stages:
        - name: install pnpm
          script: npm i -g pnpm@10

        - name: install build dependencies
          script: |
            apt-get update
            apt-get install -y rpm fakeroot

        - name: install dependencies
          script: pnpm install --frozen-lockfile

        - name: build application
          script: pnpm run build

        - name: prepare dist dependencies
          script: |
            cp package.json dist/package.json
            cd dist && npm install --omit=dev --no-audit --no-fund

        - name: build electron linux client
          script: pnpm run electron:build -- --platform=linux

      endStages:
        - name: show build summary
          script: |
            echo "✅ 构建验证完成"
            echo "分支: ${CNB_BRANCH}"
            echo "提交: ${CNB_COMMIT}"
            find release -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.yml" \) 2>/dev/null || true

# ============================================================
# tag 推送时构建并发布 Release（与 GitHub Actions 一致）
# ============================================================
$:
  tag_push:
    - name: build-electron-release
      docker:
        image: node:22
        volumes:
          - pnpm-store:/root/.local/share/pnpm/store/v3:rw
      env:
        ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        CI: 'true'
      stages:
        # 1. 创建 Release（必须在构建之前，attachments 才能上传）
        - name: create release
          type: git:release
          options:
            title: AetherOps ${CNB_BRANCH}
            description: |
              AetherOps ${CNB_BRANCH} Release

              ## Downloads
              - **Linux**: `.AppImage` (免安装)
              - **Windows/macOS**: 请前往 [GitHub Releases](https://github.com/SubDong/AetherOps/releases) 下载

        # 2. 安装构建环境
        - name: install pnpm
          script: npm i -g pnpm@10

        - name: install build dependencies
          script: |
            apt-get update
            apt-get install -y rpm fakeroot

        # 3. 安装项目依赖
        - name: install dependencies
          script: pnpm install --frozen-lockfile

        # 4. 构建前端 + 服务端
        - name: build application
          script: pnpm run build

        - name: prepare dist dependencies
          script: |
            cp package.json dist/package.json
            cd dist && npm install --omit=dev --no-audit --no-fund

        # 5. 构建 Electron Linux 客户端
        - name: build electron linux client
          script: pnpm run electron:build -- --platform=linux

        # 6. 上传构建产物到 Release
        - name: upload artifacts to release
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "release/*.AppImage"
              - "release/*.deb"
              - "release/*.blockmap"
              - "release/latest*.yml"

      endStages:
        - name: show release summary
          script: |
            echo "✅ 发布构建完成"
            echo "标签: ${CNB_BRANCH}"
            echo "提交: ${CNB_COMMIT}"
            echo "=== 已上传的产物 ==="
            find release -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.yml" -o -name "*.blockmap" \) 2>/dev/null || true
